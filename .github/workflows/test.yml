name: Formula

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-install:
    runs-on: ubuntu-22.04
    env:
      HOMEBREW_MAKE_JOBS: 2
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install and test on glibc 2.35
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          brew install majiayu000/rclean/rclean
          brew test majiayu000/rclean/rclean
          prefix=$(brew --prefix rclean)
          test -s "$prefix/share/man/man1/rclean.1"
          test -s "$prefix/etc/bash_completion.d/rclean"
          test -s "$prefix/share/zsh/site-functions/_rclean"
          test -s "$prefix/share/fish/vendor_completions.d/rclean.fish"
